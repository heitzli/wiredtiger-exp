[project]
name = "wiredtiger-documentstore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "avro>=1.12.2",
    "pydantic>=2.14.1",
    "wiredtiger",
]

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Benign teardown noise: fixtures close broker/component sockets while their
    # daemon accept/read threads are still blocked in accept()/recv(), so those
    # threads (on macOS) die with ConnectionAbortedError (errno 53 or 9).
    "ignore:Exception in thread:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.uv.sources]
wiredtiger = { git = "https://github.com/heitzli/wiredtiger.git", subdirectory = "lang/python" }
